name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      - name: YAML fixture suite (nltest)
        run: cargo run -p nl-test-runner --locked -- tests

      # optimizations.md § Testing — "Run the same program with and without
      # optimizations; compare outputs, exit codes, and exception behavior.
      # All existing tests in tests/ must pass regardless of optimization
      # level." Unlike the benchmark step below this *is* a gate: an
      # optimization that changes observable behaviour is a bug, and this is
      # what makes -O1 optional in practice rather than only on paper
      # (issue #24).
      - name: Differential fixture suite, -O0 vs -O1 (nltest)
        run: cargo run -p nl-test-runner --locked -- --differential tests

      # Not a timing gate — a shared CI runner is far too noisy for that, and
      # the baseline is recorded per host anyway (see benches/baseline.yaml).
      # This only proves every benchmark still compiles and still produces the
      # output its fixture expects, so the suite cannot rot between the
      # optimization passes it exists to measure (issue #23).
      # Debug build on purpose: it reuses what the two steps above already
      # compiled, where `-r` would pay for a second full build of the
      # workspace. The numbers it prints are meaningless (nlbench says so
      # itself) — only the exit code matters here.
      - name: Benchmark smoke run (nlbench)
        run: cargo run -p nl-bench --locked -- --quick --iterations 1 --no-compare
