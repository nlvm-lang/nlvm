---
title: "uncaught custom exception surfaces its class name and message on stderr"
file_separator: "#NLFILE"
expected_exit_code: 1
expected_stdout: ""
expected_stderr: "Unhandled exception: phase5.uncaught.MyException: nope\n\tat phase5/uncaught/Main.nl:5"
# optimizations.md § Testing: stderr carries a stack trace,
# so the -O0 and -O1 runs are not compared with each other. Both still
# have to satisfy every expectation above.
optimization_sensitive: true
---

#NLFILE phase5/uncaught/MyException.nl
namespace phase5.uncaught;
class MyException extends Exception {
	public construct(string message) {
		super(message);
	}
}

#NLFILE phase5/uncaught/Main.nl
namespace phase5.uncaught;
use phase5.uncaught.MyException;
class Main {
	public static int main(string[] args) throws MyException {
		throw new MyException("nope");
	}
}
