---
title: "Compile E013 — a `readonly` class must not let the target of one of its properties be mutated (issue #32 — FAILS TODAY: readonly is shallow, this compiles and prints 42)"
file_separator: "#NLFILE"
expected_compile_error: "E013"
---

#NLFILE phase27/readonlychain/Inner.nl
namespace phase27.readonlychain;
class Inner {
	public int v;

	public construct(int v) {
		this.v = v;
	}

	public void bump() {
		this.v = this.v + 1;
	}
}

#NLFILE phase27/readonlychain/Box.nl
namespace phase27.readonlychain;
class readonly Box {
	public Inner inner;

	public construct(Inner inner) {
		this.inner = inner;
	}
}

#NLFILE phase27/readonlychain/Main.nl
namespace phase27.readonlychain;
class Main {
	public static int main(string[] args) {
		auto b = new Box(new Inner(0));
		// `b.inner` may not be reassigned (E013), but nothing stops the
		// object it points at from being mutated — so "no property of any
		// instance can be modified" (compiler.md § Readonly classes) only
		// holds one hop deep. E013 is the closest existing code; its message
		// names the readonly class, which does not fit here (`v` belongs to
		// `Inner`), so #32 may well need a new diagnostic instead.
		b.inner.bump();
		b.inner.v = 42;
		system.Out.print(b.inner.v);
		return 0;
	}
}
