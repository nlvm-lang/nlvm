namespace phase6.list_oob;
class Main {
	public static int main(string[] args) {
		auto list = new system.List<int>();
		list.pushBack(10);
		list.pushBack(20);
		int x = list.get(2);
		system.Out.print(system.Int.toString(x));
		return 0;
	}
