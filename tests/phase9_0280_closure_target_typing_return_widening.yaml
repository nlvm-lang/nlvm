---
title: "Phase 9 — closure target typing widens an inferred return type (specs.md § Return type deduction rules, point 5)"
file_separator: "#NLFILE"
expected_exit_code: 0
expected_stdout: "3 2 1"
---

#NLFILE phase9/closure_target_typing/Main.nl
namespace phase9.closure_target_typing;
class Main {
	public static int main(string[] args) {
		// Expression body: no grammar slot exists to write an explicit
		// return type here, so the target's `float` is the only way `n`
		// (int) ever gets checked/coerced against it.
		(int) => float exprBody = (int n) => n;
		system.Out.print(system.Float.toString(exprBody(3)));
		system.Out.print(" ");

		// Block body with an omitted return type: same target-typing rule,
		// every `return` widens int -> float.
		(bool) => float blockBody = (bool b) => {
			if (b) { return 2; }
			return 1;
		};
		system.Out.print(system.Float.toString(blockBody(true)));
		system.Out.print(" ");
		system.Out.print(system.Float.toString(blockBody(false)));
		return 0;
	}
}
