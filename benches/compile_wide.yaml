#NLFILE bench/compilewide/Main.nl
namespace bench.compilewide;
class Main {
	// Generated shape, kept flat on purpose: every class is independent, so
	// what this measures is per-declaration compiler cost (name resolution,
	// type checking, constant pool building) rather than any one hot path.
	public static int main(string[] args) {
		int total = 0;
		total = total + new Worker0().step0(0);
		total = total + new Worker1().step0(1);
		total = total + new Worker2().step0(2);
		total = total + new Worker3().step0(3);
		total = total + new Worker4().step0(4);
		total = total + new Worker5().step0(5);
		total = total + new Worker6().step0(6);
		total = total + new Worker7().step0(7);
		total = total + new Worker8().step0(8);
		total = total + new Worker9().step0(9);
		total = total + new Worker10().step0(10);
		total = total + new Worker11().step0(11);
		total = total + new Worker12().step0(12);
		total = total + new Worker13().step0(13);
		total = total + new Worker14().step0(14);
		total = total + new Worker15().step0(15);
		total = total + new Worker16().step0(16);
		total = total + new Worker17().step0(17);
		total = total + new Worker18().step0(18);
		total = total + new Worker19().step0(19);
		total = total + new Worker20().step0(20);
		total = total + new Worker21().step0(21);
		total = total + new Worker22().step0(22);
		total = total + new Worker23().step0(23);
		system.Out.println(system.Int.toString(total));
		return 0;
	}
}

